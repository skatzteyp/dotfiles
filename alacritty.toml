[general]
import = [
  "~/.config/alacritty/themes/themes/one_dark.toml"
]

# Advertise a TERM that exists on every machine. Alacritty's default
# TERM=alacritty has no terminfo entry on a fresh macOS, which leaves zsh
# and tmuxline with no color. xterm-256color also matches the truecolor
# override in .tmux.conf (terminal-overrides ',xterm-256color:RGB').
[env]
TERM = "xterm-256color"

[font]
size = 12.5

[font.normal]
family = "DejaVuSansM Nerd Font"
style = "Regular"

[font.bold]
family = "DejaVuSansM Nerd Font"
style = "Bold"

[font.italic]
family = "DejaVuSansM Nerd Font"
style = "Italic"

[font.bold_italic]
family = "DejaVuSansM Nerd Font"
style = "Bold Italic"

[window]
opacity = 0.8
startup_mode = "SimpleFullscreen"
decorations = "Buttonless"
dynamic_title = true

[window.padding]
y = 10

[colors.primary]
background = "#000000"
foreground = "#e3e5e8"

# Alacritty does not expand env vars (e.g. $SHELL) in `program`.
# If you switch to a brew-installed zsh, set this to /opt/homebrew/bin/zsh.
[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", "tmux attach || tmux new-session || exec /bin/zsh -il"]

[keyboard]
bindings = [
  { key = "Slash", mods = "Control", chars = "\u001f" }
]

[bell]
duration = 0
command = "None"
